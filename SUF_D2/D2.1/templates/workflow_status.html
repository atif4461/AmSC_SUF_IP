<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workflow Status - AmSC SUF NP Demonstrator D2.1</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <div class="hero-bg"></div>
    <main class="container py-5">
      <section class="card section-card">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 mb-4">Workflow Status</h1>
          <dl class="row mb-0">
            <dt class="col-sm-3">Configuration</dt>
            <dd class="col-sm-9">{{ config_name }}</dd>

            <dt class="col-sm-3">Status</dt>
            <dd class="col-sm-9">
              <span class="badge text-bg-primary">{{ status }}</span>
            </dd>
          </dl>
        </div>
      </section>
    </main>
  </body>
</html>
